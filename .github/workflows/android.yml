# Baut die Android-App (APK) und legt sie als Release «android-latest» ab.
# Download immer unter: https://github.com/<owner>/<repo>/releases/latest/download/Zeitgeist.apk
name: Android-App bauen

on:
  push:
    branches: [main, claude/interactive-swiss-map-app-ocuqhp]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Web-App für Android bauen
        run: npm run build
        env:
          VITE_NATIVE: '1'
      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          node scripts/android-prepare.mjs
          npx cap sync android
      - name: APK bauen und signieren
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Zeitgeist.apk
          # Kopie unter dem alten Namen, damit frühere Download-Links weiter gehen
          cp Zeitgeist.apk Spurlos.apk
          notes="Zeitgeist ${VERSION_NAME} für Android, gebaut aus ${GITHUB_SHA::7}. APK aufs Handy laden, öffnen und «Installieren» tippen (einmalig «Unbekannte Apps» erlauben). Neue Versionen lassen sich einfach drüber installieren."
          if gh release view android-latest >/dev/null 2>&1; then
            git tag -f android-latest "$GITHUB_SHA"
            git push -f origin refs/tags/android-latest
            gh release upload android-latest Zeitgeist.apk Spurlos.apk --clobber
            gh release edit android-latest --title "Zeitgeist für Android ${VERSION_NAME}" --notes "$notes" --latest
          else
            gh release create android-latest Zeitgeist.apk Spurlos.apk --target "$GITHUB_SHA" --title "Zeitgeist für Android ${VERSION_NAME}" --notes "$notes" --latest
          fi
